version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.13"
  apt_packages:
    - graphviz
  jobs:
    post_checkout:
      # setuptools_scm needs the full history to compute the version
      - git fetch --unshallow || true
    pre_install:
      # Read the Docs edits conf.py, which would mark the version as dirty
      - git update-index --assume-unchanged docs/conf.py

sphinx:
  configuration: docs/conf.py

python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - docs
