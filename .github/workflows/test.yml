name: Test

on:
  push:
    branches:
      - master
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qa:
    runs-on: ubuntu-26.04
    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install --upgrade tox

    - name: Tox qa
      run: |
        tox -v -e py310-qa

  build:
    runs-on: ubuntu-26.04
    strategy:
      matrix:
        python-version: ['3.10', '3.14']
        target: [pil, imagemagick, graphicsmagick, redis, wand, dbm]
    steps:
    - uses: actions/checkout@v7

    - name: Start Redis
      if: matrix.target == 'redis'
      uses: supercharge/redis-github-action@1.8.1

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install lsof imagemagick libjpeg62 zlib1g-dev libavif-dev

    - name: Install GraphicsMagick
      if: matrix.target == 'graphicsmagick'
      run: |
        sudo apt-get install libgraphicsmagick1-dev graphicsmagick

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}

    - name: Get pip cache dir
      id: pip-cache
      run: |
        echo "CACHE_DIR=$(pip cache dir)" >> "$GITHUB_OUTPUT"

    - name: Cache
      uses: actions/cache@v6
      with:
        path: ${{ steps.pip-cache.outputs.CACHE_DIR }}
        key:
          test-${{ matrix.python-version }}-v1-${{ hashFiles('**/pyproject.toml') }}
        restore-keys: |
          test-${{ matrix.python-version }}-v1-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install --upgrade tox tox-gh-actions

    - name: Tox tests
      run: |
        tox -v
      env:
        TARGET: ${{ matrix.target }}

    - name: Upload coverage
      uses: codecov/codecov-action@v7
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        name: Python ${{ matrix.python-version }}
